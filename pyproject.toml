[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quill"
version = "0.1.0"
description = "A small code-review platform library."
authors = [{ name = "Jonah Soriano", email = "mathiasnicolasdev@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/quill"]
